<!DOCTYPE html>
<html>
<head>
  <title>My Trading Dashboard</title>
  <style>
    body { margin: 0; background: #131722; color: white; font-family: sans-serif; }
    /* Give the chart a fixed height - 100% of the screen */
    #chart-container {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="chart-container">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
      {
        "autosize": false,
        "width": "100%",
        "height": 900,
        "symbol": "FOREXCOM:EURUSD",
        "interval": "15",
        "timezone": "Etc/UTC",
        "theme": "dark",
        "style": "1",
        "locale": "en",
        "enable_publishing": false,
        "allow_symbol_change": true,
        "watchlist": [
          "FOREXCOM:EURUSD",
          "FOREXCOM:GBPUSD",
          "FOREXCOM:USDJPY",
          "FOREXCOM:USDCHF",
          "FOREXCOM:AUDUSD",
          "FOREXCOM:USDCAD",
          "FOREXCOM:NZDUSD",
          "FOREXCOM:EURGBP",
          "FOREXCOM:EURJPY",
          "FOREXCOM:EURCHF",
          "FOREXCOM:EURAUD",
          "FOREXCOM:EURCAD",
          "FOREXCOM:EURNZD",
          "FOREXCOM:GBPJPY",
          "FOREXCOM:GBPCHF",
          "FOREXCOM:GBPAUD",
          "FOREXCOM:GBPCAD",
          "FOREXCOM:GBPNZD",
          "FOREXCOM:AUDJPY",
          "FOREXCOM:AUDCHF",
          "FOREXCOM:AUDCAD",
          "FOREXCOM:AUDNZD",
          "FOREXCOM:CADJPY",
          "FOREXCOM:CADCHF",
          "FOREXCOM:CHFJPY",
          "FOREXCOM:NZDJPY",
          "FOREXCOM:NZDCHF",
          "FOREXCOM:NZDCAD",
          "FOREXCOM:SPXUSD",
          "FOREXCOM:NSXUSD",
          "FOREXCOM:UKXGBP"
        ],
        "studies": ["RSI@tv-basicstudies"],
        "support_host": "https://www.tradingview.com"
      }
      </script>
    </div>
  </div>
</body>
</html>
